<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buonanotte</title>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: rgba(22, 31, 48, 0.7);
      --accent: #8b5cf6;
      --accent-glow: rgba(139, 92, 246, 0.3);
      --text: #f8fafc;
      --text-sub: #94a3b8;
      --border: rgba(255, 255, 255, 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      user-select: none;
    }

    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow: hidden;
      position: relative;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    .card {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 350px;
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 32px 24px;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6);
      text-align: center;
      transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .tag {
      font-size: 0.7rem;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #c084fc;
      margin-bottom: 12px;
      display: block;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
    }

    p {
      font-size: 0.9rem;
      color: var(--text-sub);
      line-height: 1.5;
      margin-bottom: 24px;
    }

    .switch-btn {
      width: 100%;
      background: linear-gradient(135deg, #7c3aed, #4f46e5);
      border: none;
      color: white;
      padding: 16px;
      border-radius: 18px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 10px 25px var(--accent-glow);
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .switch-btn:active {
      transform: scale(0.96);
    }

    /* Stato Notte Profonda */
    body.deep-night {
      --bg: #030509;
      --card-bg: rgba(10, 15, 26, 0.85);
    }

    body.deep-night .card {
      border-color: rgba(139, 92, 246, 0.2);
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.9);
    }
  </style>
</head>
<body>

  <canvas id="sky"></canvas>

  <div class="card">
    <span class="tag"></span>
    <h1 id="title">ora nanna </h1>
    <p id="desc">tocca lo schermo</p>

    <button class="switch-btn" onclick="toggleNight()">
      <span id="btn-icon"></span>
      <span id="btn-text">spegni</span>
    </button>
  </div>

  <script>
    const canvas = document.getElementById('sky');
    const ctx = canvas.getContext('2d');

    let width, height;
    let particles = [];

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    class Star {
      constructor(x, y) {
        this.x = x || Math.random() * width;
        this.y = y || Math.random() * height;
        this.size = Math.random() * 2 + 0.5;
        this.alpha = Math.random() * 0.8 + 0.2;
        this.speed = Math.random() * 0.02 + 0.005;
      }

      draw() {
        this.alpha += Math.sin(Date.now() * this.speed) * 0.01;
        ctx.fillStyle = `rgba(255, 255, 255, ${Math.max(0.1, Math.min(1, this.alpha))})`;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    for (let i = 0; i < 70; i++) {
      particles.push(new Star());
    }

    function animate() {
      ctx.clearRect(0, 0, width, height);
      particles.forEach(p => p.draw());
      requestAnimationFrame(animate);
    }
    animate();

    // Interazione al tocco / click
    window.addEventListener('click', (e) => {
      if (e.target.tagName !== 'BUTTON') {
        for (let i = 0; i < 5; i++) {
          particles.push(new Star(
            e.clientX + (Math.random() - 0.5) * 40,
            e.clientY + (Math.random() - 0.5) * 40
          ));
        }
        if (particles.length > 120) particles.splice(0, 5);
      }
    });

    let isNight = false;
    let audioCtx = null;

    function toggleNight() {
      isNight = !isNight;
      document.body.classList.toggle('deep-night');

      const title = document.getElementById('title');
      const desc = document.getElementById('desc');
      const btnText = document.getElementById('btn-text');
      const btnIcon = document.getElementById('btn-icon');

      if (isNight) {
        title.textContent = "Buonanotte ❤️";
        desc.textContent = "modalità sonno";
        btnText.textContent = "accendi";
        btnIcon.textContent = "";
        playTone();
      } else {
        title.textContent = "ora di spegnere ";
        desc.textContent = "tocca lo schermo";
        btnText.textContent = "spegni";
        btnIcon.textContent = "";
      }
    }

    // Effetto sonoro rilassante sintetizzato
    function playTone() {
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(220, audioCtx.currentTime); // Nota A3
        osc.frequency.exponentialRampToValueAtTime(440, audioCtx.currentTime + 1.2);

        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.2);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start();
        osc.stop(audioCtx.currentTime + 1.2);
      } catch (e) {
        // Ignora restriction autorizzazioni audio se non ancora toccato
      }
    }
  </script>
</body>
</html>
